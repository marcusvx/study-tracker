services:
  - type: web
    name: study-tracker-backend
    env: node
    buildCommand: npm install && npm run build --workspace @study-tracker/backend
    startCommand: npm run start:prod --workspace @study-tracker/backend
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: study-tracker-db
          property: connectionString

databases:
  - name: study-tracker-db
    databaseName: studytracker
    user: studytracker_user
