services:
  - type: web
    name: study-tracker-backend
    runtime: docker
    rootDir: apps/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Supabase Postgres connection string. Set manually in the Render
      # dashboard (Project Settings > Database > Connection string).
      - key: DATABASE_URL
        sync: false
      # Supabase project URL, used to verify auth tokens via its JWKS
      # endpoint. Set manually in the Render dashboard
      # (Project Settings > API > Project URL).
      - key: SUPABASE_URL
        sync: false
